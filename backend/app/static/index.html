<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevPilot AI - Autonomous AI Coding Agent</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              850: '#151e2e',
              900: '#0f172a',
              950: '#090d16'
            }
          }
        }
      }
    }
  </script>
  <!-- React & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Monaco Editor Loader -->
  <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    .monaco-editor, .monaco-editor-background, .monaco-editor .inputarea.ime-input { background-color: #090d16 !important; }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden select-none">
  <div id="root" class="h-full w-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      // App State
      const [projects, setProjects] = useState([]);
      const [activeProject, setActiveProject] = useState(null);
      const [conversations, setConversations] = useState([]);
      const [activeConversation, setActiveConversation] = useState(null);
      const [messages, setMessages] = useState([]);
      const [files, setFiles] = useState([]);
      const [activeFile, setActiveFile] = useState(null);
      const [fileContent, setFileContent] = useState('');
      const [aiStatus, setAiStatus] = useState(null);
      const [selectedModel, setSelectedModel] = useState('gemini-flash-lite-latest');
      const [isGenerating, setIsGenerating] = useState(false);
      const [agentStatus, setAgentStatus] = useState(null);
      const [input, setInput] = useState('');
      const [bottomTab, setBottomTab] = useState('terminal');
      const [isBottomOpen, setIsBottomOpen] = useState(true);
      const [terminalLogs, setTerminalLogs] = useState([
        '[DevPilot AI] Workspace ready.',
        '[AI Engine] Connected to Google Gemini API (gemini-flash-lite-latest).'
      ]);
      const [showSettings, setShowSettings] = useState(false);
      const [showNewProject, setShowNewProject] = useState(false);
      const [newProjName, setNewProjName] = useState('');
      const [newProjType, setNewProjType] = useState('python');
      const editorRef = useRef(null);
      const monacoInstance = useRef(null);
      const chatEndRef = useRef(null);

      // Load initial state
      useEffect(() => {
        loadAIStatus();
        loadProjects();
        initMonaco();
      }, []);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, agentStatus]);

      const loadAIStatus = async () => {
        try {
          const res = await fetch('/api/v1/ai/status');
          const data = await res.json();
          setAiStatus(data);
          if (data.model) setSelectedModel(data.model);
        } catch (e) {
          console.error(e);
        }
      };

      const loadProjects = async () => {
        try {
          const res = await fetch('/api/v1/projects');
          const data = await res.json();
          setProjects(data);
          if (data.length > 0 && !activeProject) {
            selectProject(data[0]);
          }
        } catch (e) {
          console.error(e);
        }
      };

      const selectProject = async (proj) => {
        setActiveProject(proj);
        setActiveFile(null);
        setFileContent('');
        loadFiles(proj.id);
        loadConversations(proj.id);
      };

      const loadFiles = async (projId) => {
        try {
          const res = await fetch(`/api/v1/projects/${projId}/files`);
          const data = await res.json();
          if (data.success) {
            setFiles(data.files);
            const mainFile = data.files.find(f => !f.is_dir && (f.name.startsWith('main.') || f.name.startsWith('app.')));
            if (mainFile) openFile(mainFile.path, projId);
          }
        } catch (e) {
          console.error(e);
        }
      };

      const loadConversations = async (projId) => {
        try {
          const res = await fetch(`/api/v1/conversations?project_id=${projId}`);
          const data = await res.json();
          setConversations(data);
          if (data.length > 0) {
            setActiveConversation(data[0]);
            setMessages(data[0].messages || []);
          } else {
            handleNewChat(projId);
          }
        } catch (e) {
          console.error(e);
        }
      };

      const openFile = async (filePath, projId) => {
        const id = projId || activeProject?.id;
        if (!id) return;
        try {
          const res = await fetch(`/api/v1/projects/${id}/file?file_path=${encodeURIComponent(filePath)}`);
          const data = await res.json();
          if (data.success) {
            setActiveFile(filePath);
            setFileContent(data.content);
            if (monacoInstance.current) {
              monacoInstance.current.setValue(data.content);
              const ext = filePath.split('.').pop();
              const langMap = { py: 'python', js: 'javascript', ts: 'typescript', json: 'json', html: 'html', css: 'css', md: 'markdown' };
              window.monaco.editor.setModelLanguage(monacoInstance.current.getModel(), langMap[ext] || 'plaintext');
            }
          }
        } catch (e) {
          console.error(e);
        }
      };

      const saveCurrentFile = async () => {
        if (!activeProject || !activeFile || !monacoInstance.current) return;
        const content = monacoInstance.current.getValue();
        try {
          const res = await fetch(`/api/v1/projects/${activeProject.id}/file`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ file_path: activeFile, content })
          });
          const data = await res.json();
          if (data.success) {
            setTerminalLogs(prev => [...prev, `[Saved] ${activeFile}`]);
          }
        } catch (e) {
          setTerminalLogs(prev => [...prev, `[Save Error] ${e.message}`]);
        }
      };

      const initMonaco = () => {
        if (window.require) {
          window.require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });
          window.require(['vs/editor/editor.main'], function () {
            if (editorRef.current && !monacoInstance.current) {
              monacoInstance.current = window.monaco.editor.create(editorRef.current, {
                value: '# Select a file to view or edit code\n',
                language: 'python',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 13,
                minimap: { enabled: true },
                scrollBeyondLastLine: false,
              });
              monacoInstance.current.onDidChangeModelContent(() => {
                setFileContent(monacoInstance.current.getValue());
              });
            }
          });
        }
      };

      const handleSendMessage = async (promptText) => {
        const text = promptText || input;
        if (!text.trim() || isGenerating) return;
        setInput('');

        const newMsg = { id: Date.now(), role: 'user', content: text };
        setMessages(prev => [...prev, newMsg]);
        setIsGenerating(true);
        setAgentStatus('analysing_request');

        try {
          setAgentStatus('planning_implementation');
          const res = await fetch('/api/v1/agent/prompt', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              prompt: text,
              conversation_id: activeConversation?.id,
              project_id: activeProject?.id,
              model: selectedModel
            })
          });

          if (!res.ok) throw new Error('Agent failed to complete task');
          const data = await res.json();

          const assistantMsg = {
            id: Date.now() + 1,
            role: 'assistant',
            content: data.reply || 'Task completed.',
            tool_calls: data.tool_calls || []
          };
          setMessages(prev => [...prev, assistantMsg]);

          if (activeProject) loadFiles(activeProject.id);
          if (data.logs) setTerminalLogs(prev => [...prev, ...data.logs]);
        } catch (err) {
          setMessages(prev => [...prev, { id: Date.now() + 1, role: 'assistant', content: `⚠️ Error: ${err.message}` }]);
        } finally {
          setIsGenerating(false);
          setAgentStatus(null);
        }
      };

      const handleCreateProjectSubmit = async (e) => {
        e.preventDefault();
        if (!newProjName.trim()) return;
        try {
          const res = await fetch('/api/v1/projects', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ project_name: newProjName.trim(), project_type: newProjType })
          });
          const newProj = await res.json();
          setProjects(prev => [newProj, ...prev]);
          selectProject(newProj);
          setShowNewProject(false);
          setNewProjName('');
          setTerminalLogs(prev => [...prev, `[Project Created] Initialized ${newProj.project_name}`]);
        } catch (e) {
          console.error(e);
        }
      };

      const handleRunCode = async () => {
        if (!activeProject) return;
        setTerminalLogs(prev => [...prev, `[Sandbox] Executing ${activeProject.project_name}...`]);
        try {
          const res = await fetch(`/api/v1/projects/${activeProject.id}/terminal`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ command: 'run_tests' })
          });
          const data = await res.json();
          if (data.stdout) setTerminalLogs(prev => [...prev, data.stdout]);
          if (data.stderr) setTerminalLogs(prev => [...prev, `[stderr] ${data.stderr}`]);
          setTerminalLogs(prev => [...prev, `[Process Exited] Code: ${data.return_code} (${data.duration_seconds}s)`]);
        } catch (e) {
          setTerminalLogs(prev => [...prev, `[Error] ${e.message}`]);
        }
      };

      const handleNewChat = async (projId) => {
        const id = projId || activeProject?.id;
        try {
          const res = await fetch('/api/v1/conversations', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: 'New Conversation', project_id: id })
          });
          const newConv = await res.json();
          setConversations(prev => [newConv, ...prev]);
          setActiveConversation(newConv);
          setMessages([]);
        } catch (e) {
          console.error(e);
        }
      };

      return (
        <div className="flex h-screen w-screen overflow-hidden bg-slate-950">
          {/* Left Sidebar */}
          <aside className="w-64 bg-slate-900 border-r border-slate-800 flex flex-col h-full text-slate-300">
            {/* Brand */}
            <div className="p-3.5 border-b border-slate-800 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center text-white shadow-md">
                  <i data-lucide="sparkles" className="w-4 h-4"></i>
                </div>
                <div>
                  <span className="font-bold text-white text-sm">DevPilot <span className="text-[10px] px-1 py-0.5 rounded bg-indigo-500/20 text-indigo-400 font-mono">AI</span></span>
                  <span className="text-[10px] text-slate-400 block -mt-0.5">Coding Agent</span>
                </div>
              </div>
            </div>

            {/* New Chat Button */}
            <div className="p-3">
              <button onClick={() => handleNewChat()} className="w-full flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-medium text-xs py-2 px-3 rounded-lg shadow-sm transition">
                <i data-lucide="plus" className="w-3.5 h-3.5"></i>
                <span>New Chat</span>
              </button>
            </div>

            {/* Navigation Lists */}
            <div className="flex-1 overflow-y-auto px-2 space-y-4">
              <div>
                <div className="flex items-center justify-between px-2 py-1 text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                  <span className="flex items-center gap-1.5"><i data-lucide="folder-git-2" className="w-3.5 h-3.5"></i> Projects</span>
                  <button onClick={() => setShowNewProject(true)} className="p-0.5 hover:text-white rounded"><i data-lucide="plus" className="w-3.5 h-3.5"></i></button>
                </div>
                <div className="mt-1 space-y-0.5">
                  {projects.map(p => (
                    <button key={p.id} onClick={() => selectProject(p)} className={`w-full flex items-center justify-between px-2.5 py-1.5 rounded-md text-xs transition text-left ${activeProject?.id === p.id ? 'bg-slate-800 text-indigo-300 font-medium' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'}`}>
                      <span className="truncate flex items-center gap-2">
                        <i data-lucide="code-2" className="w-3.5 h-3.5 text-slate-400"></i>
                        <span className="truncate">{p.project_name}</span>
                      </span>
                      <span className="text-[10px] px-1.5 py-0.2 bg-slate-950 rounded border border-slate-800 text-slate-400">{p.project_type}</span>
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <div className="px-2 py-1 text-[11px] font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                  <i data-lucide="message-square" className="w-3.5 h-3.5"></i> History
                </div>
                <div className="mt-1 space-y-0.5">
                  {conversations.map(c => (
                    <button key={c.id} onClick={() => { setActiveConversation(c); setMessages(c.messages || []); }} className={`w-full flex items-center gap-2 px-2.5 py-1.5 rounded-md text-xs transition text-left truncate ${activeConversation?.id === c.id ? 'bg-slate-800 text-indigo-300 font-medium' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'}`}>
                      <i data-lucide="message-square" className="w-3 h-3 text-slate-500"></i>
                      <span className="truncate">{c.title}</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>

            {/* Footer Status */}
            <div className="p-3 border-t border-slate-800 space-y-2">
              <div className="flex items-center justify-between px-2.5 py-1.5 rounded-md bg-slate-950 border border-slate-800 text-xs">
                <div className="flex items-center gap-2">
                  <span className="relative flex h-2 w-2">
                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                  </span>
                  <span className="text-slate-300 font-mono text-[11px] truncate max-w-[100px]">{aiStatus?.model || 'Gemini'}</span>
                </div>
                <span className="text-[10px] text-slate-400">{aiStatus?.latency_ms ? `${Math.round(aiStatus.latency_ms)}ms` : 'Ready'}</span>
              </div>
              <button onClick={() => setShowSettings(true)} className="w-full flex items-center justify-between px-2.5 py-1.5 rounded-md text-xs text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition">
                <span className="flex items-center gap-2"><i data-lucide="settings" className="w-3.5 h-3.5"></i> Settings</span>
                <i data-lucide="chevron-right" className="w-3.5 h-3.5 opacity-60"></i>
              </button>
            </div>
          </aside>

          {/* Main Workspace Layout */}
          <div className="flex-1 flex flex-col h-full overflow-hidden">
            {/* Header */}
            <header className="h-12 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-4">
              <div className="flex items-center gap-2.5">
                <i data-lucide="folder-git-2" className="w-4 h-4 text-indigo-400"></i>
                <span className="font-semibold text-white text-xs">{activeProject ? activeProject.project_name : 'DevPilot Workspace'}</span>
                {activeProject && <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">{activeProject.project_type}</span>}
              </div>

              <div className="flex items-center gap-2">
                <div className="flex items-center gap-1.5 bg-slate-950 px-2.5 py-1 rounded border border-slate-800 text-xs">
                  <i data-lucide="sparkles" className="w-3.5 h-3.5 text-indigo-400"></i>
                  <select value={selectedModel} onChange={e => setSelectedModel(e.target.value)} className="bg-transparent text-slate-200 text-xs focus:outline-none cursor-pointer">
                    <option value="gemini-flash-lite-latest" className="bg-slate-900">gemini-flash-lite (Fastest)</option>
                    <option value="gemini-flash-latest" className="bg-slate-900">gemini-flash-latest</option>
                    <option value="gemini-pro-latest" className="bg-slate-900">gemini-pro (Deep Reasoning)</option>
                  </select>
                </div>

                <button onClick={saveCurrentFile} className="flex items-center gap-1 px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium transition">
                  <i data-lucide="save" className="w-3.5 h-3.5"></i>
                  <span>Save</span>
                </button>

                <button onClick={handleRunCode} className="flex items-center gap-1 px-3 py-1 rounded bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold shadow-sm transition">
                  <i data-lucide="play" className="w-3.5 h-3.5 fill-current"></i>
                  <span>Run</span>
                </button>

                {activeProject && (
                  <a href={`/api/v1/projects/${activeProject.id}/download`} title="Download Project ZIP" className="p-1.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 transition">
                    <i data-lucide="download" className="w-3.5 h-3.5"></i>
                  </a>
                )}
              </div>
            </header>

            {/* Split View: Chat + Code Editor */}
            <div className="flex-1 flex overflow-hidden">
              {/* Left Half: AI Chat */}
              <div className="w-1/2 border-r border-slate-800 flex flex-col h-full bg-slate-950">
                <div className="flex-1 overflow-y-auto p-4 space-y-4">
                  {messages.length === 0 ? (
                    <div className="h-full flex flex-col items-center justify-center max-w-lg mx-auto text-center px-4">
                      <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-500 to-pink-500 flex items-center justify-center text-white mb-3 shadow-xl">
                        <i data-lucide="sparkles" className="w-6 h-6"></i>
                      </div>
                      <h2 className="text-base font-bold text-white mb-1">DevPilot AI Coding Agent</h2>
                      <p className="text-xs text-slate-400 mb-6">Describe an application or feature, and the agent will plan, code, test, and debug it.</p>
                      
                      <div className="grid grid-cols-2 gap-2 w-full text-left">
                        <button onClick={() => handleSendMessage('Create a complete Python calculator with unit tests.')} className="p-2.5 rounded-lg border border-slate-800 bg-slate-900/60 hover:bg-slate-800 text-xs text-slate-300 hover:text-white transition">
                          <strong className="block text-indigo-300">Python Calculator</strong>
                          <span className="text-[10px] text-slate-400">Complete logic & pytest tests</span>
                        </button>
                        <button onClick={() => handleSendMessage('Create a FastAPI REST API with CRUD endpoints and SQLite database.')} className="p-2.5 rounded-lg border border-slate-800 bg-slate-900/60 hover:bg-slate-800 text-xs text-slate-300 hover:text-white transition">
                          <strong className="block text-indigo-300">FastAPI CRUD API</strong>
                          <span className="text-[10px] text-slate-400">SQLite models & endpoints</span>
                        </button>
                      </div>
                    </div>
                  ) : (
                    messages.map((m, idx) => (
                      <div key={m.id || idx} className={`flex gap-3 max-w-2xl ${m.role === 'user' ? 'ml-auto flex-row-reverse' : 'mr-auto'}`}>
                        <div className={`w-7 h-7 rounded-lg flex items-center justify-center text-white text-xs flex-shrink-0 ${m.role === 'user' ? 'bg-indigo-600' : 'bg-gradient-to-tr from-purple-600 to-indigo-600'}`}>
                          <i data-lucide={m.role === 'user' ? 'user' : 'bot'} className="w-4 h-4"></i>
                        </div>
                        <div className={`rounded-xl px-4 py-2.5 text-xs leading-relaxed max-w-[85%] whitespace-pre-wrap ${m.role === 'user' ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-slate-900 border border-slate-800 text-slate-200 rounded-tl-none'}`}>
                          {m.content}
                        </div>
                      </div>
                    ))
                  )}

                  {agentStatus && (
                    <div className="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-indigo-950/40 border border-indigo-800/40 text-indigo-300 text-xs animate-pulse max-w-xs">
                      <i data-lucide="sparkles" className="w-3.5 h-3.5 animate-spin text-indigo-400"></i>
                      <span className="font-medium capitalize">{agentStatus.replace(/_/g, ' ')}...</span>
                    </div>
                  )}
                  <div ref={chatEndRef} />
                </div>

                {/* Prompt Input Form */}
                <div className="p-3 border-t border-slate-800 bg-slate-900/80">
                  <form onSubmit={e => { e.preventDefault(); handleSendMessage(); }} className="flex items-center gap-2">
                    <input
                      type="text"
                      value={input}
                      onChange={e => setInput(e.target.value)}
                      placeholder="Ask DevPilot AI to write code, create files, or fix bugs..."
                      className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-indigo-500 transition"
                    />
                    <button type="submit" disabled={!input.trim() || isGenerating} className="p-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 text-white transition">
                      <i data-lucide="send" className="w-4 h-4"></i>
                    </button>
                  </form>
                </div>
              </div>

              {/* Right Half: File Explorer + Monaco Editor */}
              <div className="w-1/2 flex h-full">
                {/* File Explorer Tree */}
                <div className="w-48 bg-slate-900 border-r border-slate-800 flex flex-col h-full text-slate-300">
                  <div className="px-3 py-2 border-b border-slate-800 flex items-center justify-between text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                    <span>Files</span>
                    <button onClick={() => activeProject && loadFiles(activeProject.id)} title="Refresh" className="p-0.5 hover:text-white rounded"><i data-lucide="refresh-cw" className="w-3 h-3"></i></button>
                  </div>
                  <div className="flex-1 overflow-y-auto p-1 space-y-0.5 text-xs">
                    {files.map(f => (
                      <button key={f.path} onClick={() => !f.is_dir && openFile(f.path)} className={`w-full flex items-center gap-2 px-2 py-1.5 rounded transition text-left truncate ${activeFile === f.path ? 'bg-indigo-600/20 text-indigo-300 font-medium' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'}`}>
                        <i data-lucide={f.is_dir ? "folder" : "file-code"} className="w-3.5 h-3.5 text-indigo-400 flex-shrink-0"></i>
                        <span className="truncate">{f.name}</span>
                      </button>
                    ))}
                  </div>
                </div>

                {/* Monaco Editor Frame */}
                <div className="flex-1 flex flex-col h-full bg-slate-950">
                  <div className="h-8 bg-slate-900 border-b border-slate-800 flex items-center px-3 text-xs font-mono text-indigo-300">
                    {activeFile ? (
                      <span className="flex items-center gap-1.5"><i data-lucide="file-code" className="w-3 h-3 text-indigo-400"></i> {activeFile}</span>
                    ) : (
                      <span className="text-slate-500">No file selected</span>
                    )}
                  </div>
                  <div ref={editorRef} className="flex-1 w-full h-full"></div>
                </div>
              </div>
            </div>

            {/* Bottom Panel */}
            <div className={`bg-slate-900 border-t border-slate-800 flex flex-col transition-all duration-150 ${isBottomOpen ? 'h-48' : 'h-8'}`}>
              <div className="h-8 bg-slate-950 px-3 flex items-center justify-between border-b border-slate-800 text-xs">
                <div className="flex items-center gap-2">
                  <button onClick={() => { setBottomTab('terminal'); setIsBottomOpen(true); }} className={`flex items-center gap-1.5 px-2.5 py-1 rounded-t ${bottomTab === 'terminal' ? 'bg-slate-900 text-indigo-400 border-t-2 border-indigo-500' : 'text-slate-400'}`}>
                    <i data-lucide="terminal" className="w-3.5 h-3.5"></i> Terminal
                  </button>
                </div>
                <button onClick={() => setIsBottomOpen(!isBottomOpen)} className="p-1 text-slate-400 hover:text-slate-200">
                  <i data-lucide={isBottomOpen ? "chevron-down" : "chevron-up"} className="w-3.5 h-3.5"></i>
                </button>
              </div>

              {isBottomOpen && (
                <div className="flex-1 overflow-y-auto p-3 bg-slate-950 font-mono text-xs text-slate-300 space-y-1">
                  {terminalLogs.map((log, i) => (
                    <div key={i} className="whitespace-pre-wrap">{log}</div>
                  ))}
                </div>
              )}
            </div>
          </div>

          {/* New Project Modal */}
          {showNewProject && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm">
              <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-2xl text-slate-200">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-white text-sm">Create New Project</h3>
                  <button onClick={() => setShowNewProject(false)}><i data-lucide="x" className="w-4 h-4"></i></button>
                </div>
                <form onSubmit={handleCreateProjectSubmit} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Project Name</label>
                    <input type="text" autoFocus required value={newProjName} onChange={e => setNewProjName(e.target.value)} placeholder="e.g. calculator-app" className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white focus:outline-none focus:border-indigo-500" />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Template</label>
                    <select value={newProjType} onChange={e => setNewProjType(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white focus:outline-none focus:border-indigo-500">
                      <option value="python">Python CLI / Script</option>
                      <option value="streamlit">Streamlit Web Application</option>
                      <option value="fastapi">FastAPI REST Backend</option>
                      <option value="react">React Application</option>
                    </select>
                  </div>
                  <div className="pt-2 flex justify-end gap-2">
                    <button type="button" onClick={() => setShowNewProject(false)} className="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300">Cancel</button>
                    <button type="submit" className="px-4 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium">Create</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Settings Modal */}
          {showSettings && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm">
              <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-2xl text-slate-200">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-white text-sm">Settings</h3>
                  <button onClick={() => setShowSettings(false)}><i data-lucide="x" className="w-4 h-4"></i></button>
                </div>
                <div className="space-y-3 text-xs">
                  <div className="p-3 rounded-xl bg-slate-950 border border-slate-800">
                    <div className="flex justify-between items-center mb-2">
                      <span className="font-semibold text-white">Google Gemini API</span>
                      <span className="px-2 py-0.5 rounded text-[10px] bg-emerald-500/20 text-emerald-400">Connected</span>
                    </div>
                    <div className="text-slate-400 text-[11px] space-y-1">
                      <div>Active Model: <strong className="text-slate-200 font-mono">{aiStatus?.model}</strong></div>
                      <div>Latency: <strong className="text-slate-200 font-mono">{aiStatus?.latency_ms ? `${Math.round(aiStatus.latency_ms)}ms` : 'Ready'}</strong></div>
                      <div>Secret Storage: <strong className="text-slate-200 font-mono">backend/.env (Safe)</strong></div>
                    </div>
                  </div>
                </div>
                <div className="mt-4 flex justify-end">
                  <button onClick={() => setShowSettings(false)} className="px-4 py-1.5 rounded-lg bg-slate-800 text-white">Close</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
